name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest #macos-15 
# -project NetworkingTutorial/NetworkingTutorial.xcodeproj
          # -scheme NetworkingTutorial
           # - name: Set Default Scheme
      #   run: |
      #     scheme_list=$(xcodebuild -list -json)
      #     default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
      #     echo $default | cat >default
      #     echo Using default scheme: $default
    steps:
      - name: setup-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Debug — Print directory structure
        run: |
          pwd
          ls -la
          find . -name "*.xcodeproj" -maxdepth 6

      - name: Show available destinations
        run: |
          xcodebuild -showdestinations -project /Users/runner/work/NetworkingArchitectureTutorial/NetworkingArchitectureTutorial/NetworkingTutorial.xcodeproj -scheme "NetworkingTutorial"

      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Clean, Build
        env:
          scheme: NetworkingTutorial
          platform: ${{ 'iOS Simulator' }}
        run: |
          xcodebuild clean build-for-testing -project NetworkingTutorial/NetworkingTutorial.xcodeproj -scheme "NetworkingTutorial" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk iphonesimulator -destination "platform=iOS Simulator,arch=x86_64,OS=26.2,name=iPhone 17" ONLY_ACTIVE_ARCH=YES OTHER_SWIFT_FLAGS="-D ED_SKIP_SWIFT_FORMAT"
          # xcrun simctl list devices available
          # clean build test -showdestinations
      - name: Test
        env:
          scheme: NetworkingTutorial
          platform: ${{ 'iOS Simulator' }}
        run: |
          xcodebuild test-without-building -project NetworkingTutorial/NetworkingTutorial.xcodeproj -scheme "NetworkingTutorial" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2" ONLY_ACTIVE_ARCH=YES OTHER_SWIFT_FLAGS="-D ED_SKIP_SWIFT_FORMAT"
      #     # xcrun xctrace returns via stderr, not the expected stdout (see https://developer.apple.com/forums/thread/663959)
      #     # device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
      #     # if [ $scheme = NetworkingTutorial ]; then scheme=$(cat NetworkingTutorial); fi
